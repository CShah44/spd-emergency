# [B] RabbitMQ: the queue between the request service and the matching service.
#
# A StatefulSet with its own disk, so messages still waiting in the queue survive
# the pod being deleted or rescheduled. Two things make that work:
#   * the pod is always called rabbitmq-0, and RabbitMQ names its data folder
#     after its hostname. A Deployment's pods get a new random name each time,
#     so a restarted broker would ignore the saved data.
#   * volumeClaimTemplates gives the pod a volume that follows it across restarts.
# The queue is durable and the messages are persistent (common/messaging.py), so
# RabbitMQ writes them to that disk. Services reconnect by themselves while the
# broker restarts (the matching consumer retries every 3 s).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins # the plugin list; adds rabbitmq_prometheus so queue depth can be graphed
  namespace: emergency
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: emergency
  labels: {app: rabbitmq}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672} # UI: kubectl port-forward -n emergency svc/rabbitmq 15672
            - {name: prometheus, containerPort: 15692} # metrics, read by Prometheus
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: plugins, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins, readOnly: true}
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: plugins
          configMap: {name: rabbitmq-plugins}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq # -> amqp://guest:guest@rabbitmq:5672/ (see configmap.yaml)
  namespace: emergency
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
