# [B] Prometheus: collects /metrics from every pod and keeps the numbers Grafana draws.
#
# Pods come and go (and matching-service is autoscaled), so nothing is listed by hand:
# Prometheus asks the Kubernetes API for the pods in this namespace and scrapes the ones
# it recognises by their `app` label. That is what the Role below allows.
# The job names are the same as in Docker Compose (observability/prometheus/prometheus.yml),
# so one dashboard works for both.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: emergency
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: emergency
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: emergency
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: emergency
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-discovery
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: emergency
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      # The app services, the coordinator and the storage nodes. Each pod answers /metrics on
      # the port its own container serves: 8000 for the Python apps, 9000 for storage nodes.
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [emergency]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: request-service|matching-service|coordinator|storage
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [job]
            regex: storage
            target_label: job
            replacement: storage-node
          - source_labels: [__meta_kubernetes_pod_ip, job]
            regex: (.+);(request-service|matching-service|coordinator)
            target_label: __address__
            replacement: $1:8000
          - source_labels: [__meta_kubernetes_pod_ip, job]
            regex: (.+);storage-node
            target_label: __address__
            replacement: $1:9000
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod

      # RabbitMQ's own metrics, per queue (the default endpoint only adds up all queues).
      - job_name: rabbitmq
        metrics_path: /metrics/detailed
        params:
          family: [queue_coarse_metrics, queue_consumer_count]
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [emergency]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: rabbitmq
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:15692
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: emergency
  labels: {app: prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {} # history is lost when the pod restarts: fine for a demo
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus # -> http://prometheus:9090 (Grafana's data source)
  namespace: emergency
spec:
  selector: {app: prometheus}
  ports:
    - {port: 9090, targetPort: 9090}
