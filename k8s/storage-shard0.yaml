# [A] Shard 0: a StatefulSet of 2 storage nodes (primary + replica) and a
# headless Service. storage-shard1.yaml and storage-shard2.yaml are the same
# with the number changed (generated by scripts/gen_k8s_shards.py).
#
# Why a StatefulSet and not a Deployment?
#   * Stable names: pods are shard0-0 and shard0-1, and keep those names when
#     they restart. Ordinal 0 is the primary, 1 the replica (ROLE=from-ordinal).
#   * Stable DNS: shard0-0.shard0 always points at the same pod (via the
#     headless Service below), so the coordinator can find each node.
#   * Its own disk: volumeClaimTemplates gives EACH pod its own volume, which
#     follows that pod across restarts. A Deployment's pods would share or lose it.
apiVersion: v1
kind: Service
metadata:
  name: shard0
  namespace: emergency
spec:
  clusterIP: None # headless: no load balancing, one DNS record per pod
  # Keep DNS records for pods that aren't ready. A paused or recovering node is
  # "not ready", but the coordinator still has to reach it to catch it up.
  publishNotReadyAddresses: true
  selector: {app: storage, shard: "0"}
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard0
  namespace: emergency
spec:
  serviceName: shard0
  replicas: 2 # primary + replica
  podManagementPolicy: Parallel # start both at once; recovery handles the order
  selector:
    matchLabels: {app: storage, shard: "0"}
  template:
    metadata:
      labels: {app: storage, shard: "0"}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: storage-node
          image: storage-node:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: emergency-config}
          env:
            - name: SHARD_ID
              value: "0"
            - name: ROLE
              value: from-ordinal # shard0-0 -> primary, shard0-1 -> replica
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: NODE_URL # how the coordinator reaches this pod
              value: "http://$(POD_NAME).shard0:9000"
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          # Readiness = "can serve data" (503 while paused).
          readinessProbe:
            httpGet: {path: /health, port: 9000}
            periodSeconds: 5
          # Liveness = "process is alive" (still 200 while paused), so a paused
          # node isn't restarted during the failure demo.
          livenessProbe:
            httpGet: {path: /livez, port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
  volumeClaimTemplates:
    - metadata:
        name: data # -> PersistentVolumeClaims data-shard0-0 and data-shard0-1
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
