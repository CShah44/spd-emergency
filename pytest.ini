[pytest]
# Lets tests `import common...` and `import coordinator...` the same way the
# containers do (each container has common/ next to its app/).
pythonpath = services
testpaths = tests
# Integration tests stop real containers, so they only run when asked for:
#   pytest -m integration
addopts = -m "not integration"
markers =
    integration: runs against a live Compose or Kubernetes stack (tests/integration)
