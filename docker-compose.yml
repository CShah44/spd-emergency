# The whole system: storage side [A] (coordinator + 6 storage nodes, 3 shards x primary +
# replica) and app side [B] (RabbitMQ, request service, matching service).
#
#   docker compose up --build -d
#   curl localhost:8000/internal/status             # storage cluster
#   curl localhost:8080/docs                        # client API (Swagger UI)
#   docker compose stop storage-s0-primary          # storage failure demo
#   docker compose up -d --scale matching-service=3 # more matchers share the queue
#
# Host ports: request service 8080, coordinator 8000, nodes 9001-9006 (for /health and
# /admin/pause), RabbitMQ 5672 and its management UI 15672 (guest / guest).
# The matching service has no host port on purpose: a fixed port would stop --scale.

x-storage-node: &storage-node
  build:
    context: .
    dockerfile: services/storage_node/Dockerfile
  image: storage-node
  depends_on:
    - coordinator
  restart: "no" # failure demos stop nodes on purpose; don't bring them back automatically

services:
  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
    image: coordinator
    environment:
      NUM_SHARDS: "3"
      HEARTBEAT_TIMEOUT_S: "10"
    ports:
      - "8000:8000"
    healthcheck: # lets the app services wait for it (depends_on: service_healthy)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -- app side [B] ---------------------------------------------------------------------------

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq # RabbitMQ names its data folder after the hostname: keep it fixed so the volume is reused
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest / guest)
    volumes: [rabbitmq-data:/var/lib/rabbitmq] # queued messages survive a restart
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  request-service:
    build:
      context: .
      dockerfile: services/request_service/Dockerfile
    image: request-service
    environment:
      COORDINATOR_URL: http://coordinator:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MATCHING_SERVICE_URL: http://matching-service:8000
      DEMO_CONTROLS: "true" # the web page's Pause / Resume buttons for storage nodes
    depends_on:
      coordinator: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    ports:
      - "8080:8000"
    restart: unless-stopped

  ui-service:
    build:
      context: .
      dockerfile: services/ui_service/Dockerfile
    image: ui-service
    environment:
      API_URL: http://request-service:8000
    depends_on:
      request-service: {condition: service_healthy}
    ports:
      - "8081:8000" # the Delta Command web page: http://localhost:8081
    restart: unless-stopped

  matching-service:
    build:
      context: .
      dockerfile: services/matching_service/Dockerfile
    image: matching-service
    environment:
      COORDINATOR_URL: http://coordinator:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MAX_MATCH_KM: "50"
    depends_on:
      coordinator: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  # -- storage side [A] -------------------------------------------------------------------------

  storage-s0-primary:
    <<: *storage-node
    environment: &node-env
      NODE_ID: s0-primary
      SHARD_ID: "0"
      ROLE: primary
      NODE_URL: http://storage-s0-primary:9000
      COORDINATOR_URL: http://coordinator:8000
      HEARTBEAT_INTERVAL_S: "3"
    volumes: [s0-primary-data:/data]
    ports: ["9001:9000"]

  storage-s0-replica:
    <<: *storage-node
    environment:
      <<: *node-env
      NODE_ID: s0-replica
      ROLE: replica
      NODE_URL: http://storage-s0-replica:9000
    volumes: [s0-replica-data:/data]
    ports: ["9002:9000"]

  storage-s1-primary:
    <<: *storage-node
    environment:
      <<: *node-env
      NODE_ID: s1-primary
      SHARD_ID: "1"
      NODE_URL: http://storage-s1-primary:9000
    volumes: [s1-primary-data:/data]
    ports: ["9003:9000"]

  storage-s1-replica:
    <<: *storage-node
    environment:
      <<: *node-env
      NODE_ID: s1-replica
      SHARD_ID: "1"
      ROLE: replica
      NODE_URL: http://storage-s1-replica:9000
    volumes: [s1-replica-data:/data]
    ports: ["9004:9000"]

  storage-s2-primary:
    <<: *storage-node
    environment:
      <<: *node-env
      NODE_ID: s2-primary
      SHARD_ID: "2"
      NODE_URL: http://storage-s2-primary:9000
    volumes: [s2-primary-data:/data]
    ports: ["9005:9000"]

  storage-s2-replica:
    <<: *storage-node
    environment:
      <<: *node-env
      NODE_ID: s2-replica
      SHARD_ID: "2"
      ROLE: replica
      NODE_URL: http://storage-s2-replica:9000
    volumes: [s2-replica-data:/data]
    ports: ["9006:9000"]

volumes:
  rabbitmq-data:
  s0-primary-data:
  s0-replica-data:
  s1-primary-data:
  s1-replica-data:
  s2-primary-data:
  s2-replica-data:
